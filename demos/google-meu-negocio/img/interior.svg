<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração do interior do Studio Bella (marca fictícia)">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1DCD3"/>
      <stop offset="1" stop-color="#EBCFC4"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C79D78"/>
      <stop offset="1" stop-color="#B08562"/>
    </linearGradient>
    <linearGradient id="espelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1EC"/>
      <stop offset=".55" stop-color="#E4D8D2"/>
      <stop offset="1" stop-color="#D6C7C0"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#FFF4DF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF4DF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#parede)"/>
  <!-- rodameio -->
  <rect x="0" y="330" width="800" height="120" fill="#E3C2B6"/>
  <g stroke="#D6B1A4" stroke-width="2"><path d="M0 330h800"/><path d="M40 330v120M100 330v120M160 330v120M220 330v120M280 330v120M340 330v120M400 330v120M460 330v120M520 330v120M580 330v120M640 330v120M700 330v120M760 330v120" opacity=".6"/></g>
  <!-- piso -->
  <rect x="0" y="450" width="800" height="150" fill="url(#piso)"/>
  <g stroke="#A27756" stroke-width="2" opacity=".7"><path d="M0 480h800M0 520h800M0 565h800"/><path d="M90 450l-40 150M250 450l-30 150M410 450v150M570 450l30 150M730 450l40 150"/></g>
  <!-- pendentes -->
  <g>
    <path d="M200 0v70M400 0v58M600 0v70" stroke="#3A2A30" stroke-width="2"/>
    <ellipse cx="200" cy="150" rx="140" ry="90" fill="url(#brilho)"/>
    <ellipse cx="400" cy="140" rx="140" ry="90" fill="url(#brilho)"/>
    <ellipse cx="600" cy="150" rx="140" ry="90" fill="url(#brilho)"/>
    <path d="M176 92a24 24 0 0 1 48 0z M376 80a24 24 0 0 1 48 0z M576 92a24 24 0 0 1 48 0z" fill="#B98B4E"/>
    <g fill="#FFF1D6"><circle cx="200" cy="96" r="7"/><circle cx="400" cy="84" r="7"/><circle cx="600" cy="96" r="7"/></g>
  </g>
  <!-- letreiro na parede -->
  <circle cx="400" cy="210" r="52" fill="none" stroke="#7A2E44" stroke-width="3"/>
  <text x="400" y="226" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="44" font-style="italic" font-weight="600" fill="#7A2E44">SB</text>
  <!-- estações -->
  <g id="est">
    <ellipse cx="170" cy="220" rx="72" ry="96" fill="#C9A063"/>
    <ellipse cx="170" cy="220" rx="62" ry="86" fill="url(#espelho)"/>
    <path d="M128 170l40-36M140 196l52-48" stroke="#fff" stroke-width="7" opacity=".55" stroke-linecap="round"/>
    <rect x="90" y="318" width="160" height="16" rx="4" fill="#5B2335"/>
    <rect x="96" y="334" width="148" height="70" rx="6" fill="#6E2C3E"/>
    <path d="M170 340v58" stroke="#5B2335" stroke-width="2"/>
    <g fill="#C9A063"><circle cx="160" cy="370" r="3"/><circle cx="180" cy="370" r="3"/></g>
    <!-- frascos -->
    <rect x="102" y="294" width="14" height="24" rx="3" fill="#F7E9DE"/>
    <rect x="120" y="286" width="12" height="32" rx="3" fill="#B98B4E"/>
    <rect x="218" y="298" width="18" height="20" rx="4" fill="#E3A7A0"/>
  </g>
  <use href="#est" x="460"/>
  <!-- cadeiras -->
  <g id="cad">
    <rect x="128" y="372" width="84" height="88" rx="18" fill="#8E3A52"/>
    <rect x="120" y="440" width="100" height="26" rx="12" fill="#A44B64"/>
    <rect x="164" y="466" width="12" height="40" fill="#3A2A30"/>
    <ellipse cx="170" cy="510" rx="44" ry="9" fill="#3A2A30"/>
    <rect x="114" y="420" width="12" height="40" rx="6" fill="#7A2E44"/>
    <rect x="214" y="420" width="12" height="40" rx="6" fill="#7A2E44"/>
  </g>
  <use href="#cad" x="460"/>
  <!-- prateleira central -->
  <rect x="330" y="300" width="140" height="10" rx="3" fill="#B98B4E"/>
  <rect x="330" y="360" width="140" height="10" rx="3" fill="#B98B4E"/>
  <g>
    <rect x="342" y="272" width="16" height="28" rx="4" fill="#F7E9DE"/><rect x="364" y="266" width="14" height="34" rx="4" fill="#7A2E44"/><rect x="384" y="278" width="20" height="22" rx="5" fill="#E3A7A0"/><rect x="410" y="270" width="14" height="30" rx="4" fill="#C9A063"/><rect x="430" y="274" width="18" height="26" rx="4" fill="#F7E9DE"/>
    <rect x="346" y="334" width="20" height="26" rx="5" fill="#C9A063"/><rect x="372" y="328" width="14" height="32" rx="4" fill="#F7E9DE"/><rect x="392" y="336" width="18" height="24" rx="4" fill="#7A2E44"/><rect x="416" y="330" width="14" height="30" rx="4" fill="#E3A7A0"/><rect x="436" y="334" width="20" height="26" rx="5" fill="#F7E9DE"/>
  </g>
  <!-- planta -->
  <path d="M378 520l6-50h32l6 50z" fill="#F7E9DE"/>
  <g fill="#5E8C6A"><ellipse cx="386" cy="440" rx="10" ry="30" transform="rotate(-25 386 440)"/><ellipse cx="414" cy="438" rx="10" ry="32" transform="rotate(22 414 438)"/><ellipse cx="400" cy="428" rx="11" ry="38"/><ellipse cx="372" cy="458" rx="8" ry="22" transform="rotate(-50 372 458)"/><ellipse cx="428" cy="456" rx="8" ry="22" transform="rotate(50 428 456)"/></g>
  <!-- sombra no piso -->
  <ellipse cx="400" cy="524" rx="40" ry="6" fill="#000" opacity=".12"/>
</svg>
