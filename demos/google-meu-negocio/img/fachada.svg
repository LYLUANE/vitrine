<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração da fachada do Studio Bella (marca fictícia)">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7DC"/>
      <stop offset="1" stop-color="#FBF5EF"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A33"/>
      <stop offset="1" stop-color="#5A3E48"/>
