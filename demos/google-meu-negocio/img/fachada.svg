      <path d="M0 19.5h40M20 0v10M0 10h40M0 10v10M40 10v10" stroke="#DCCDBD" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#ceu)"/>
