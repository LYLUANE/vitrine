    <g fill="#7FAE84"><circle cx="175" cy="226" r="11"/><circle cx="200" cy="222" r="13"/><circle cx="232" cy="224" r="12"/><circle cx="256" cy="228" r="10"/><circle cx="362" cy="226" r="11"/><circle cx="390" cy="221" r="13"/><circle cx="420" cy="224" r="12"/><circle cx="442" cy="228" r="10"/><circle cx="548" cy="226" r="11"/><circle cx="575" cy="222" r="13"/><circle cx="605" cy="224" r="12"/><circle cx="628" cy="228" r="10"/></g>
