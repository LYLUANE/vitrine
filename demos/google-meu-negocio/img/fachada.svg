    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9B8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F3D9B8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tijolo" width="40" height="20" patternUnits="userSpaceOnUse">
