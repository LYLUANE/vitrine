<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento · Vidraçaria Cristal (marca fictícia)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#13262f; --teal:#2b6f76; --brass:#b8893b; --line:#d9dfe0; --soft:#f3f6f6; --mut:#5d6b70; }
  * { box-sizing: border-box; }
  html { background: #e9ecec; }
  body { margin: 0; font: 10.5pt/1.45 Inter, system-ui, sans-serif; color: var(--ink); }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; justify-content: center; padding: 12px; background: var(--ink); }
  .bar button, .bar a { font: 600 14px Inter, sans-serif; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
  .bar .p { background: var(--brass); color: #fff; }
  .bar .s { background: #ffffff1f; color: #fff; }
  .page { width: 210mm; min-height: 297mm; margin: 20px auto; background: #fff; padding: 16mm 15mm 14mm; box-shadow: 0 10px 40px #13262f22; position: relative; display: flex; flex-direction: column; }
  .page::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 5mm; background: linear-gradient(90deg, var(--ink) 0 70%, var(--teal) 70% 88%, var(--brass) 88%); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 6mm; border-bottom: 1px solid var(--line); }
  .marca { display: flex; gap: 12px; align-items: center; }
  .marca svg { width: 52px; height: 52px; }
  .marca h1 { font: 700 21pt/1 Fraunces, Georgia, serif; margin: 0; letter-spacing: -.01em; }
  .marca p { margin: 3px 0 0; color: var(--mut); font-size: 9pt; }
  .emp { text-align: right; font-size: 8.5pt; color: var(--mut); line-height: 1.55; }
  .titulo { display: flex; justify-content: space-between; align-items: flex-end; margin: 7mm 0 5mm; }
  .titulo h2 { font: 700 15pt Fraunces, Georgia, serif; margin: 0; }
  .titulo h2 span { color: var(--teal); }
  .meta { display: flex; gap: 18px; font-size: 9pt; }
  .meta div { text-align: right; } .meta small { display: block; color: var(--mut); font-size: 7.5pt; text-transform: uppercase; letter-spacing: .08em; }
  .cli { background: var(--soft); border-radius: 6px; padding: 4mm 5mm; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 4mm; font-size: 9.5pt; }
  .cli small { display: block; color: var(--mut); font-size: 7.5pt; text-transform: uppercase; letter-spacing: .08em; }
  table { width: 100%; border-collapse: collapse; margin-top: 6mm; font-size: 9.5pt; }
  th { text-align: left; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 600; padding: 0 2mm 2mm; border-bottom: 1.5px solid var(--ink); }
  td { padding: 2.6mm 2mm; border-bottom: 1px solid var(--line); vertical-align: top; }
  td small { display: block; color: var(--mut); font-size: 8pt; }
  .r { text-align: right; white-space: nowrap; }
  .n { color: var(--mut); width: 7mm; }
  .fim { display: grid; grid-template-columns: 1fr 72mm; gap: 8mm; margin-top: 6mm; }
  .cond h3, .obs h3 { font: 700 10pt Fraunces, Georgia, serif; margin: 0 0 2mm; }
  .cond dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1.5mm 4mm; font-size: 9pt; }
  .cond dt { color: var(--mut); } .cond dd { margin: 0; }
  .tot div { display: flex; justify-content: space-between; padding: 1.6mm 0; font-size: 9.5pt; }
  .tot .g { margin-top: 2mm; padding: 3.5mm 4mm; background: var(--ink); color: #fff; border-radius: 6px; font-size: 12pt; }
  .tot .g b { font: 700 14pt Fraunces, Georgia, serif; }
  .obs { margin-top: 6mm; padding: 3.5mm 4mm; border-left: 3px solid var(--brass); background: #fbf7ef; font-size: 9pt; }
  .obs p { margin: 0; }
  .ass { margin-top: auto; padding-top: 16mm; display: grid; grid-template-columns: 1fr 1fr; gap: 14mm; font-size: 8.5pt; color: var(--mut); text-align: center; }
  .ass div { border-top: 1px solid var(--ink); padding-top: 2mm; }
  footer { margin-top: 8mm; display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--mut); border-top: 1px solid var(--line); padding-top: 3mm; }
  .selo { display: inline-block; padding: 1mm 3mm; border-radius: 99px; font-size: 7.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; background: #e7f1f1; color: var(--teal); margin-left: 6px; vertical-align: middle; }
  @media screen and (max-width: 820px) { .page { width: auto; margin: 0; padding: 22px 16px; min-height: 0; box-shadow: none; } header { flex-direction: column; } .emp { text-align: left; } .cli, .fim { grid-template-columns: 1fr; } .titulo { flex-direction: column; align-items: flex-start; gap: 8px; } .meta div { text-align: left; } table { font-size: 9pt; } }
  @media print { html { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; width: auto; min-height: 297mm; } @page { size: A4; margin: 0; } }
</style>
</head>
<body>
<div class="bar"><button class="p" onclick="print()">Imprimir / salvar PDF</button><a class="s" href="index.html">Voltar ao sistema</a></div>
<div class="page" id="doc"></div>
<script src="data.js"></script>
<script>
(function () {
  const db = loadDB();
  const id = new URLSearchParams(location.search).get('id');
  const o = db.orcamentos.find(x => x.id === id) || db.orcamentos.find(x => x.status === 'enviado') || db.orcamentos[0];
  const pm = Object.fromEntries(db.produtos.map(p => [p.id, p]));
  const c = db.clientes.find(x => x.id === o.cliente) || { nome: '—' };
  const t = totais(o, db.produtos);
  document.title = o.num + ' · ' + EMPRESA.nome + ' (marca fictícia)';
  const linhas = o.itens.map((it, i) => {
    const p = pm[it.prod];
    const real = medidaReal(it, p), cob = medidaCobrada(it, p);
    let med = '', qtd = '';
    if (p.unidade === 'm2') { med = num(it.l) + ' × ' + num(it.a) + ' m'; qtd = num(cob) + ' m²'; }
    else if (p.unidade === 'ml') { med = num(it.c) + ' m'; qtd = num(cob) + ' m'; }
    else { med = '—'; qtd = it.q + ' un'; }
    const nota = p.unidade === 'm2' && cob > real + 0.0001 ? '<small>área mínima de ' + num(p.areaMin) + ' m² por peça</small>' : '';
    return `<tr><td class="n">${i + 1}</td><td><b>${esc(p.nome)}</b>${nota}</td><td class="r">${p.unidade === 'un' ? '—' : it.q + ' pç · ' + med}</td><td class="r">${qtd}</td><td class="r">${brl(+it.p)}</td><td class="r"><b>${brl(subtotalItem(it, p))}</b></td></tr>`;
  }).join('');
  const sel = { rascunho: 'rascunho', enviado: '', aprovado: 'aprovado', recusado: 'recusado' }[o.status];
  document.getElementById('doc').innerHTML = `
  <header>
    <div class="marca">${LOGO_SVG}<div><h1>${EMPRESA.nome}</h1><p>${EMPRESA.slogan}</p></div></div>
    <div class="emp">${EMPRESA.endereco}<br>${EMPRESA.fone} · ${EMPRESA.email}<br>${EMPRESA.doc}</div>
  </header>
  <div class="titulo">
    <h2>Orçamento <span>${o.num}</span>${sel ? `<span class="selo">${sel}</span>` : ''}</h2>
    <div class="meta"><div><small>Emissão</small>${fmtData(o.data)}</div><div><small>Válido até</small><b>${fmtData(o.validade)}</b></div></div>
  </div>
  <div class="cli">
    <div><small>Cliente</small><b>${esc(c.nome)}</b>${c.doc ? '<br>' + esc(c.doc) : ''}</div>
    <div><small>Contato</small>${esc(c.tel || '')}<br>${esc(c.email || '')}</div>
    <div><small>Bairro</small>${esc(c.cidade || '—')}</div>
  </div>
  <table>
    <thead><tr><th>#</th><th>Descrição</th><th class="r">Peças · medidas</th><th class="r">Qtd. cobrada</th><th class="r">Valor unit.</th><th class="r">Subtotal</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table>
  <div class="fim">
    <div class="cond"><h3>Condições</h3><dl>
      <dt>Pagamento</dt><dd>${esc(o.pagamento)}</dd>
      <dt>Prazo</dt><dd>${o.prazo} dias úteis após a aprovação e a conferência das medidas</dd>
      <dt>Validade</dt><dd>${fmtData(o.validade)}</dd>
      <dt>Garantia</dt><dd>Vidros temperados com garantia de fábrica contra defeito; instalação com garantia de 1 ano (política da empresa fictícia).</dd>
    </dl></div>
    <div class="tot">
      <div><span>Subtotal</span><b>${brl(t.sub)}</b></div>
      ${t.desc ? `<div><span>Desconto${o.descTipo === '%' ? ' (' + num(+o.desc, 0) + '%)' : ''}</span><b>− ${brl(t.desc)}</b></div>` : ''}
      <div><span>Frete</span><b>${t.frete ? brl(t.frete) : 'incluso'}</b></div>
      <div class="g"><span>Total</span><b>${brl(t.total)}</b></div>
    </div>
  </div>
  ${o.obs ? `<div class="obs"><h3>Observações</h3><p>${esc(o.obs)}</p></div>` : ''}
  <div class="ass"><div>${EMPRESA.nome}</div><div>De acordo do cliente · data</div></div>
  <footer><span>Gerado pelo Cristal Orçamentos</span><span>Projeto demonstrativo · marca, empresa e cliente fictícios</span></footer>`;
})();
</script>
</body>
</html>
